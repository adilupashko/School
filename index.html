<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School – תרגולים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Rubik',system-ui,sans-serif;background:#fbf5ea;color:#1d2a33}
  header{background:linear-gradient(135deg,#0b6e8a,#1497a8);color:#fff;padding:28px 20px}
  .wrap{max-width:760px;margin:0 auto}
  h1{margin:0;font-size:30px}
  header p{margin:6px 0 0;opacity:.9}
  main{padding:24px 20px 60px}
  h2{font-size:15px;letter-spacing:.05em;color:#0b6e8a;margin:24px 0 10px}
  a.card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e6dccb;border-radius:16px;padding:16px 18px;margin-bottom:10px;text-decoration:none;color:inherit;transition:transform .15s, box-shadow .15s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(11,110,138,.12)}
  .ico{font-size:28px}
  .t{font-weight:800}
  .d{color:#5e6d77;font-size:15px}
</style>
</head>
<body>
<header><div class="wrap"><h1>📚 התרגולים שלי</h1><p>בחרי תרגול כדי להתחיל</p></div></header>
<main class="wrap">
  <h2>אנגלית</h2>
  <a class="card" href="beach/"><span class="ico">🌊</span><span><div class="t">Unseen: The Girl Who Cleaned the Beach</div><div class="d">קטע קריאה ו-14 שאלות · רמה A2</div></span></a>
</main>
</body>
</html>
