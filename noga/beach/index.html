<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unseen Practice – The Girl Who Cleaned the Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0b6e8a; --sea-d:#084f63; --sand:#fbf5ea; --sand-2:#f3e7d1; --ink:#1d2a33; --muted:#5e6d77;
    --ok:#1f8a4c; --ok-bg:#e5f6ec; --bad:#c2410c; --bad-bg:#fdeee6; --hint:#fff4c2; --card:#ffffff; --line:#e6dccb;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--sand);font-size:17px;line-height:1.55}
  header{background:linear-gradient(135deg,var(--sea),#1497a8);color:#fff;padding:22px 20px 18px}
  .wrap{max-width:1180px;margin:0 auto}
  header h1{font-family:'Fraunces',serif;font-size:clamp(22px,3.4vw,32px);margin:0 0 4px;font-weight:700}
  header p{margin:0;opacity:.9;font-size:15px}
  .scorebar{display:flex;align-items:center;gap:12px;margin-top:14px;font-weight:700;font-size:15px}
  .track{flex:1;height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;max-width:420px}
  .fill{height:100%;width:0;background:#ffd166;border-radius:99px;transition:width .4s}
  .tabs{display:none}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;padding:22px 20px 60px}
  .textcol{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .textcol h2{font-family:'Fraunces',serif;font-size:24px;margin:0 0 12px;color:var(--sea-d)}
  .para{display:flex;gap:10px;padding:8px 10px;margin:0 -10px 6px;border-radius:10px;transition:background .3s}
  .para .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sand-2);color:var(--sea-d);font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:2px}
  .para.hl{background:var(--hint)}
  .part{margin:26px 0 10px}
  .part:first-child{margin-top:0}
  .part h3{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--sea)}
  .part p{margin:2px 0 0;color:var(--muted);font-size:15px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;transition:border-color .2s, box-shadow .2s}
  .q.ok{border-color:#9fd8b6;box-shadow:0 0 0 3px var(--ok-bg)}
  .q.bad{border-color:#f3b89b;box-shadow:0 0 0 3px var(--bad-bg)}
  .qhead{display:flex;gap:10px;align-items:flex-start}
  .qnum{flex:none;background:var(--sea);color:#fff;font-weight:800;border-radius:8px;padding:1px 9px;font-size:15px;margin-top:2px}
  .qtext{font-weight:700}
  .pts{margin-left:auto;flex:none;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
  .opts{display:grid;gap:8px;margin:12px 0 4px}
  .opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--sand);border:2px solid transparent;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;color:inherit}
  .opt:hover{border-color:var(--sand-2)}
  .opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px}
  .opt.sel{border-color:var(--sea);background:#e8f4f7}
  .opt.sel .l{background:var(--sea);border-color:var(--sea);color:#fff}
  .opt.right{border-color:var(--ok);background:var(--ok-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .tf{display:flex;gap:10px;margin:12px 0 10px}
  .tf .opt{flex:1;justify-content:center;font-weight:800}
  label.small{display:block;font-size:14px;color:var(--muted);margin:6px 0 4px;font-weight:700}
  select,input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:inherit}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--sea)}
  textarea{min-height:110px;resize:vertical}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
  .btn.check{background:var(--sea);color:#fff}
  .btn.check:hover{background:var(--sea-d)}
  .btn.ghost{background:transparent;color:var(--sea);border:2px solid #cfe6ec}
  .btn.ghost:hover{background:#eef7f9}
  .fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-bg);color:#14572f}
  .fb.bad{background:var(--bad-bg);color:#7a2a08}
  .fb.info{background:#eef7f9;color:var(--sea-d)}
  .hintbox{margin-top:10px;padding:9px 12px;border-radius:10px;background:var(--hint);font-size:15px;display:none}
  .hintbox.show{display:block}
  .wc{font-size:13px;color:var(--muted);margin-top:4px}
  .final{background:var(--card);border:2px solid var(--sea);border-radius:18px;padding:20px;margin-top:20px;text-align:center}
  .final .big{font-family:'Fraunces',serif;font-size:48px;color:var(--sea-d);line-height:1}
  .final .msg{font-weight:700;margin:8px 0 14px}
  .bottom{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .bottom .btn{padding:12px 20px;font-size:17px}
  .tips{margin-top:20px;background:var(--sand-2);border-radius:16px;padding:14px 18px;font-size:15px}
  .tips h4{margin:0 0 6px;color:var(--sea-d)}
  .tips ul{margin:0;padding-left:20px}
  @media (max-width:820px){
    main{grid-template-columns:1fr;padding:0 14px 60px;gap:0}
    .tabs{display:flex;position:sticky;top:0;z-index:5;background:var(--sand);padding:10px 14px;gap:8px;border-bottom:1px solid var(--line)}
    .tabs button{flex:1;font:inherit;font-weight:800;padding:10px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
    .tabs button.on{background:var(--sea);border-color:var(--sea);color:#fff}
    .textcol{position:static;max-height:none;margin-top:14px}
    body:not(.show-text) .textcol{display:none}
    body.show-text .qcol{display:none}
    .qcol{margin-top:14px}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Unseen Practice: The Girl Who Cleaned the Beach</h1>
    <p>Read the text and answer the questions in English. Click <b>Check</b> after each answer, or check everything at the end.</p>
    <div class="scorebar"><span>Score:</span><div class="track"><div class="fill" id="fill"></div></div><span id="scoreTxt">0 / 100</span></div>
  </div>
</header>

<div class="tabs" role="tablist">
  <button id="tabText" onclick="showTab('text')">📖 Text</button>
  <button id="tabQ" class="on" onclick="showTab('q')">✏️ Questions</button>
</div>

<main class="wrap">
  <section class="textcol" id="textcol" aria-label="Reading text">
    <h2>The Girl Who Cleaned the Beach</h2>
    <div id="paras"></div>
  </section>
  <section class="qcol" id="qcol" aria-label="Questions"></section>
</main>

<script src="../../assets/report.js"></script>
<script>
const PARAS = [
  "Lily Evans is fourteen years old and lives in a small town near the sea in Wales. Every summer, she spends a lot of time on the beach with her friends. Last year, something made her very sad. She saw plastic bottles, bags and old fishing nets everywhere on the sand.",
  "“The beach was my favourite place, but it looked terrible,” Lily says. “One day I saw a seagull with a plastic bag around its leg. It couldn't fly. That was the moment I decided to do something.”",
  "The next Saturday, Lily went to the beach with two big bags and a pair of gloves. She worked for three hours and filled both bags. At first, people walked past her and didn't say anything. But after a few weeks, some of her classmates joined her. Then their parents came too.",
  "Lily started a group called “Clean Waves.” Today the group has more than eighty members, from young children to grandparents. They meet on the first Saturday of every month. In one year, they collected over two tons of rubbish. They also visit schools and teach students how to use less plastic.",
  "Not everything was easy. “Sometimes it rained, and only three people came,” Lily remembers. “On those days I wanted to stop. But my grandmother told me, ‘Small steps make big changes.’ I never forgot that.”",
  "Last month, Lily received a prize from the town for her work. She used the prize money to buy special bins for the beach. “I don't want to be famous,” she says. “I just want the beach to be clean for the animals and for the next generation.”"
];

const norm = s => (s||"").toLowerCase().replace(/[^a-z\s']/g," ").replace(/\s+/g," ").trim();

const PARTS = {
  A:["Part A – Multiple choice","Choose the correct answer."],
  B:["Part B – True or False","Choose T or F, then choose the sentence from the text that proves it."],
  C:["Part C – Open questions","Answer in English. You can use words from the text."],
  D:["Part D – Reference words","What does the word in bold refer to?"],
  E:["Part E – Vocabulary","Find a word in the paragraph that means…"],
  F:["Part F – Your opinion","Write 2–3 sentences."]
};

const QS = [
  {id:1,part:"A",type:"mc",pts:6,para:2,prompt:"Lily decided to clean the beach after she…",
   opts:["won a prize from the town","saw a bird in trouble","read about plastic at school","talked to her grandmother"],ans:1,
   hint:"Look at paragraph 2. What did Lily see one day?",
   explain:"In paragraph 2 she saw a seagull with a plastic bag around its leg. A seagull is a bird."},
  {id:2,part:"A",type:"mc",pts:6,para:3,prompt:"At the beginning, the people on the beach…",
   opts:["helped Lily","laughed at Lily","didn't pay attention to Lily","gave Lily more bags"],ans:2,
   hint:"Look for the words “At first” in paragraph 3.",
   explain:"“At first, people walked past her and didn't say anything.”"},
  {id:3,part:"A",type:"mc",pts:6,para:4,prompt:"How often does “Clean Waves” meet?",
   opts:["every Saturday","once a month","twice a year","every summer"],ans:1,
   hint:"Paragraph 4: “They meet on the first Saturday of…”",
   explain:"“The first Saturday of every month” means once a month."},
  {id:4,part:"B",type:"tf",pts:8,para:4,prompt:"Only children are members of “Clean Waves.”",ans:false,
   proofs:["Lily started a group called “Clean Waves.”","Today the group has more than eighty members, from young children to grandparents.","They meet on the first Saturday of every month.","But after a few weeks, some of her classmates joined her."],proofAns:1,
   hint:"Paragraph 4: who are the members? Are there only children?",
   explain:"False. The members are “from young children to grandparents”, so there are adults too."},
  {id:5,part:"B",type:"tf",pts:8,para:5,prompt:"Lily never wanted to stop, even on bad days.",ans:false,
   proofs:["Not everything was easy.","That was the moment I decided to do something.","On those days I wanted to stop.","I never forgot that."],proofAns:2,
   hint:"Paragraph 5: what did Lily feel on the rainy days?",
   explain:"False. Lily says: “On those days I wanted to stop.”"},
  {id:6,part:"C",type:"text",pts:8,para:2,prompt:"Why couldn't the seagull fly?",
   check:a=>/bag/.test(norm(a)),
   hint:"Paragraph 2. Your answer can start with “Because…”",
   explain:"Because it had a plastic bag around its leg."},
  {id:7,part:"C",type:"two",pts:8,para:4,prompt:"Write TWO things that “Clean Waves” does.",
   hint:"Paragraph 4. Look at the last two sentences.",
   explain:"Any two: they clean the beach / collect rubbish; they visit schools; they teach students how to use less plastic."},
  {id:8,part:"C",type:"text",pts:8,para:6,prompt:"What did Lily buy with the prize money?",
   check:a=>/\bbins?\b/.test(norm(a)),
   hint:"Paragraph 6, second sentence.",
   explain:"She bought special bins for the beach."},
  {id:9,part:"D",type:"text",pts:6,para:2,prompt:"Paragraph 2: “<b>It</b> couldn't fly.”  It = ?",
   check:a=>/(seagull|bird|gull)/.test(norm(a)),
   hint:"Which animal is in the sentence before?",
   explain:"It = the seagull."},
  {id:10,part:"D",type:"text",pts:6,para:3,prompt:"Paragraph 3: “Then <b>their</b> parents came too.”  Whose parents?",
   check:a=>/(classmate|class mate|friend)/.test(norm(a)),
   hint:"Look at the sentence before. Who joined Lily?",
   explain:"their = Lily's classmates. Their parents came too."},
  {id:11,part:"E",type:"text",pts:6,para:1,prompt:"Paragraph 1: a word that means <b>unhappy</b>",
   check:a=>norm(a)==="sad"||norm(a)==="very sad",
   hint:"Something made Lily very …",explain:"sad"},
  {id:12,part:"E",type:"text",pts:6,para:4,prompt:"Paragraph 4: a word that means <b>garbage</b>",
   check:a=>norm(a)==="rubbish",
   hint:"They collected over two tons of …",explain:"rubbish"},
  {id:13,part:"E",type:"text",pts:6,para:6,prompt:"Paragraph 6: a word that means <b>award</b>",
   check:a=>norm(a)==="prize",
   hint:"Lily received a … from the town.",explain:"prize"},
  {id:14,part:"F",type:"opinion",pts:12,para:5,prompt:"Lily's grandmother said: “Small steps make big changes.” What does this mean? Do you agree? Why?",
   hint:"Explain the sentence in your own words, then write “I agree / I don't agree because…”",
   explain:"Example: It means that small actions can lead to big results over time. I agree, because Lily started alone and now her group has more than eighty members."}
];

const state = {}; // id -> {val, earned, checked}
const T0 = Date.now(); const hintsUsed = new Set(); let lastSentSig = null, attempt = 0;
QS.forEach(q=>state[q.id]={val:q.type==="two"?["",""]:(q.type==="tf"?{tf:null,proof:""}:null),earned:0,checked:false});

try{const saved=JSON.parse(localStorage.getItem("unseen-beach")||"null"); if(saved) Object.assign(state,saved);}catch(e){}
function save(){try{localStorage.setItem("unseen-beach",JSON.stringify(state));}catch(e){}}

// render text
document.getElementById("paras").innerHTML = PARAS.map((p,i)=>`<div class="para" id="p${i+1}"><span class="n">${i+1}</span><div>${p}</div></div>`).join("");

// render questions
const qcol=document.getElementById("qcol");
let html="", lastPart="";
QS.forEach(q=>{
  if(q.part!==lastPart){lastPart=q.part;html+=`<div class="part"><h3>${PARTS[q.part][0]}</h3><p>${PARTS[q.part][1]}</p></div>`;}
  html+=`<div class="q" id="q${q.id}"><div class="qhead"><span class="qnum">${q.id}</span><span class="qtext">${q.prompt}</span><span class="pts">${q.pts} pts</span></div>`;
  if(q.type==="mc"){
    html+=`<div class="opts">`+q.opts.map((o,i)=>`<button class="opt" data-q="${q.id}" data-i="${i}" onclick="pickMC(${q.id},${i})"><span class="l">${"abcd"[i]}</span><span>${o}</span></button>`).join("")+`</div>`;
  } else if(q.type==="tf"){
    html+=`<div class="tf"><button class="opt" data-tf="${q.id}-true" onclick="pickTF(${q.id},true)">✔ True</button><button class="opt" data-tf="${q.id}-false" onclick="pickTF(${q.id},false)">✘ False</button></div>
    <label class="small" for="pr${q.id}">Proof from the text:</label>
    <select id="pr${q.id}" onchange="state[${q.id}].val.proof=this.value;save()"><option value="">— choose a sentence —</option>${q.proofs.map((p,i)=>`<option value="${i}">${p}</option>`).join("")}</select>`;
  } else if(q.type==="text"){
    html+=`<div style="margin-top:10px"><input type="text" id="in${q.id}" placeholder="Type your answer…" oninput="state[${q.id}].val=this.value;save()" onkeydown="if(event.key==='Enter')check(${q.id})"></div>`;
  } else if(q.type==="two"){
    html+=`<label class="small" for="in${q.id}a">a.</label><input type="text" id="in${q.id}a" placeholder="First thing…" oninput="state[${q.id}].val[0]=this.value;save()">
    <label class="small" for="in${q.id}b">b.</label><input type="text" id="in${q.id}b" placeholder="Second thing…" oninput="state[${q.id}].val[1]=this.value;save()">`;
  } else if(q.type==="opinion"){
    html+=`<div style="margin-top:10px"><textarea id="in${q.id}" placeholder="Write 2–3 sentences…" oninput="state[${q.id}].val=this.value;wc(${q.id});save()"></textarea><div class="wc" id="wc${q.id}">0 words</div></div>`;
  }
  html+=`<div class="row"><button class="btn check" onclick="check(${q.id})">Check</button><button class="btn ghost" onclick="hint(${q.id})">💡 Hint</button><button class="btn ghost" id="sa${q.id}" style="display:none" onclick="showAns(${q.id})">Show answer</button></div>
  <div class="hintbox" id="h${q.id}"></div><div class="fb" id="fb${q.id}"></div></div>`;
});
html+=`<div class="bottom"><button class="btn check" onclick="checkAll()">✅ Check all &amp; see my score</button><button class="btn ghost" onclick="resetAll()">↺ Start over</button></div>
<div id="final"></div>
<div class="tips"><h4>Tips for the test</h4><ul>
<li>Read the title and the questions first, then read the text.</li>
<li>The answers usually come in the same order as the text.</li>
<li>You don't need to know every word. Guess from the sentence and keep reading.</li>
<li><b>Why</b> → look for <i>because</i>. <b>When</b> → look for a time. <b>Who</b> → look for a person.</li>
<li>Never leave an answer empty!</li></ul></div>`;
qcol.innerHTML=html;

// restore UI from saved state
QS.forEach(q=>{
  const v=state[q.id].val;
  if(q.type==="mc"&&v!==null) markSel(q.id,v);
  if(q.type==="tf"){ if(v.tf!==null) markTF(q.id,v.tf); document.getElementById("pr"+q.id).value=v.proof; }
  if(q.type==="text"||q.type==="opinion"){ document.getElementById("in"+q.id).value=v||""; if(q.type==="opinion") wc(q.id); }
  if(q.type==="two"){ document.getElementById("in"+q.id+"a").value=v[0]; document.getElementById("in"+q.id+"b").value=v[1]; }
});
updateScore();

function pickMC(id,i){state[id].val=i;markSel(id,i);clearFb(id);save();}
function markSel(id,i){document.querySelectorAll(`.opt[data-q="${id}"]`).forEach(b=>{b.classList.remove("right","wrong");b.classList.toggle("sel",+b.dataset.i===i);});}
function pickTF(id,v){state[id].val.tf=v;markTF(id,v);clearFb(id);save();}
function markTF(id,v){[true,false].forEach(x=>{const b=document.querySelector(`[data-tf="${id}-${x}"]`);b.classList.remove("right","wrong");b.classList.toggle("sel",x===v);});}
function wc(id){const n=(state[id].val||"").trim().split(/\s+/).filter(Boolean).length;document.getElementById("wc"+id).textContent=n+(n===1?" word":" words");}
function clearFb(id){const el=document.getElementById("q"+id);el.classList.remove("ok","bad");}

const CATS=[/(clean|rubbish|garbage|trash|collect|pick)/,/(school|visit)/,/(teach|less plastic|use less)/];

function grade(q){
  const v=state[q.id].val;
  if(q.type==="mc") return v===null?null:(v===q.ans?q.pts:0);
  if(q.type==="tf"){ if(v.tf===null&&v.proof==="") return null; let e=0; if(v.tf===q.ans)e+=4; if(v.proof!==""&&+v.proof===q.proofAns)e+=4; return e; }
  if(q.type==="text") return !norm(v)?null:(q.check(v)?q.pts:0);
  if(q.type==="two"){
    if(!norm(v[0])&&!norm(v[1])) return null;
    const used=new Set(); let e=0;
    v.forEach(a=>{const n=norm(a); const c=CATS.findIndex((r,i)=>!used.has(i)&&r.test(n)); if(n&&c>-1){used.add(c);e+=4;}});
    return e;
  }
  if(q.type==="opinion"){ const n=(v||"").trim().split(/\s+/).filter(Boolean).length; if(!n) return null; return n>=15?12:(n>=6?6:0); }
}

function check(id,silent){
  const q=QS.find(x=>x.id===id), g=grade(q), el=document.getElementById("q"+id), fb=document.getElementById("fb"+id);
  if(g===null){ if(!silent){fb.className="fb show info";fb.textContent="Answer the question first 🙂";} return; }
  state[id].earned=g; state[id].checked=true; save();
  el.classList.remove("ok","bad");
  if(q.type==="opinion"){
    el.classList.add(g===12?"ok":"bad");
    fb.className="fb show "+(g===12?"ok":"bad");
    fb.innerHTML=(g===12?"<b>Nice work!</b> Good length. ":"<b>Write a bit more</b> (2–3 full sentences). ")+`Check: did you explain the meaning, say if you agree, and give a reason?<br><br><i>${q.explain}</i>`;
  } else if(g===q.pts){
    el.classList.add("ok"); fb.className="fb show ok"; fb.innerHTML=`<b>${["Correct!","Great job!","Well done!","Excellent!"][id%4]}</b> ${q.explain}`;
    document.getElementById("sa"+id).style.display="none";
  } else {
    el.classList.add("bad"); fb.className="fb show bad";
    let msg = g>0?`<b>Almost!</b> You got ${g} of ${q.pts} points. `:"<b>Not quite.</b> ";
    if(q.type==="tf"){ const v=state[id].val; msg+= (v.tf!==q.ans?"Check True/False again. ":"True/False is right ✔. ")+(+v.proof!==q.proofAns||v.proof===""?"Look again at the proof sentence.":"The proof is right ✔."); }
    else if(q.type==="two") msg+="Each answer should be a different thing the group does. ";
    else msg+="Try again, or use a hint.";
    fb.innerHTML=msg; document.getElementById("sa"+id).style.display="";
  }
  if(q.type==="mc"){ document.querySelectorAll(`.opt[data-q="${id}"]`).forEach(b=>{ if(+b.dataset.i===state[id].val) b.classList.add(g===q.pts?"right":"wrong"); }); }
  if(q.type==="tf"){ const b=document.querySelector(`[data-tf="${id}-${state[id].val.tf}"]`); if(b) b.classList.add(state[id].val.tf===q.ans?"right":"wrong"); }
  updateScore();
}

function showAns(id){const q=QS.find(x=>x.id===id),fb=document.getElementById("fb"+id);fb.className="fb show info";fb.innerHTML="<b>Answer:</b> "+q.explain+(q.type==="tf"?`<br><b>Proof:</b> “${q.proofs[q.proofAns]}”`:"");}

function hint(id){
  const q=QS.find(x=>x.id===id),h=document.getElementById("h"+id); hintsUsed.add(id);
  h.className="hintbox show"; h.innerHTML="💡 "+q.hint;
  document.querySelectorAll(".para").forEach(p=>p.classList.remove("hl"));
  const p=document.getElementById("p"+q.para); p.classList.add("hl");
  if(window.matchMedia("(max-width:820px)").matches){ /* on phones, keep the question in view; text tab shows the highlight */ }
  else p.scrollIntoView({behavior:"smooth",block:"nearest"});
  setTimeout(()=>p.classList.remove("hl"),6000);
}

function updateScore(){
  const total=QS.reduce((s,q)=>s+(state[q.id].checked?state[q.id].earned:0),0);
  document.getElementById("scoreTxt").textContent=total+" / 100";
  document.getElementById("fill").style.width=total+"%";
  return total;
}

function checkAll(){
  QS.forEach(q=>check(q.id,true));
  const total=updateScore(), empty=QS.filter(q=>grade(q)===null).length;
  const msg= total>=90?"Amazing! You're ready for the test! 🌟":total>=75?"Very good! Look again at the red questions. 👍":total>=55?"Good effort! Use the hints and try the red ones again. 💪":"Keep going! Read the text again slowly and use the hints. 📖";
  document.getElementById("final").innerHTML=`<div class="final"><div class="big">${total}</div><div>out of 100</div><div class="msg">${msg}</div>${empty?`<div style="color:var(--bad);font-weight:700">${empty} question${empty>1?"s are":" is"} still empty.</div>`:""}</div>`;
  document.getElementById("final").scrollIntoView({behavior:"smooth",block:"center"});
  sendReport(total, empty);
}

function describe(q){
  const v=state[q.id].val;
  if(q.type==="mc") return v===null?"—":"abcd"[v]+". "+q.opts[v];
  if(q.type==="tf") return (v.tf===null?"—":(v.tf?"T":"F"))+(v.proof!==""?" | הוכחה: "+q.proofs[+v.proof]:" | בלי הוכחה");
  if(q.type==="two") return v.filter(Boolean).join(" ; ")||"—";
  return (v||"").trim()||"—";
}

async function sendReport(total, empty){
  const sig=JSON.stringify(QS.map(q=>state[q.id].val));
  if(sig===lastSentSig) return;
  lastSentSig=sig; attempt++;
  const lines=QS.map(q=>{
    const g=grade(q), mark=g===null?"⬜ ריק":(g===q.pts?"✅":(g>0?"🟡":"❌"));
    return `${q.id}. ${mark} (${g===null?0:g}/${q.pts})  תשובה: ${describe(q)}${hintsUsed.has(q.id)?"  💡רמז":""}`;
  });
  const mins=Math.max(1,Math.round((Date.now()-T0)/60000));
  const status = empty>0 ? `סיים/ה עם ${empty} שאלות ריקות` : (total>=90?"מצוין – מוכנ/ה למבחן":total>=75?"טוב מאוד":total>=55?"בסדר – כדאי לחזור על השאלות השגויות":"צריך עוד תרגול");
  const box=document.getElementById("final").querySelector(".final");
  const note=document.createElement("div"); note.style.cssText="margin-top:10px;font-size:14px;color:#5e6d77"; note.textContent="✉️ Sending your result…"; box&&box.appendChild(note);
  const r = window.SchoolReport ? await SchoolReport.send({
    practice:"Unseen: The Girl Who Cleaned the Beach", score:total, max:100, status, lines,
    extra:`ניסיון מספר: ${attempt} · זמן: כ-${mins} דקות · רמזים: ${hintsUsed.size}`
  }) : {ok:false};
  note.textContent = r.ok ? "✉️ Your result was sent to Mom." : (r.skipped ? "" : "✉️ Couldn't send the result (no internet?).");
}

function resetAll(){
  try{localStorage.removeItem("unseen-beach");}catch(e){}
  QS.forEach(q=>{
    state[q.id]={val:q.type==="two"?["",""]:(q.type==="tf"?{tf:null,proof:""}:null),earned:0,checked:false};
    clearFb(q.id);
    ["fb","h"].forEach(p=>{document.getElementById(p+q.id).className=p==="fb"?"fb":"hintbox";});
    document.getElementById("sa"+q.id).style.display="none";
  });
  document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel","right","wrong"));
  document.querySelectorAll("input[type=text],textarea").forEach(i=>i.value="");
  document.querySelectorAll("select").forEach(s=>s.value="");
  QS.filter(q=>q.type==="opinion").forEach(q=>wc(q.id));
  document.getElementById("final").innerHTML="";
  updateScore();
  window.scrollTo({top:0,behavior:"smooth"});
}

function showTab(t){
  document.body.classList.toggle("show-text",t==="text");
  document.getElementById("tabText").classList.toggle("on",t==="text");
  document.getElementById("tabQ").classList.toggle("on",t!=="text");
  window.scrollTo({top:0});
}
</script>
</body>
