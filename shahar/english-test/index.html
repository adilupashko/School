*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-size:17px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:24px;margin:6px 0 4px}
h2{font-size:18px;margin:22px 0 8px}
.sub{color:var(--mut);font-size:15px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.plan b{display:block;margin-top:8px}
.plan b:first-child{margin-top:0}
.plan span{color:var(--mut);font-size:15px}
.btn{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;color:inherit;cursor:pointer}
.btn small{display:block;color:var(--mut);font-size:14px}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-weight:500}
.btn.pri small{color:#dbe6ff}
.btn.alt{background:var(--soft);border-color:#cfdcff}
.btn.warn{background:#fff4e5;border-color:#f3d19c}
.row{display:flex;gap:8px}
.row .btn{flex:1;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.back{background:none;border:none;color:var(--pri);font:inherit;padding:6px 0;cursor:pointer}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.cnt{color:var(--mut);font-size:14px}
.big{font-size:32px;font-weight:700;text-align:center;direction:ltr;margin:8px 0 2px}
.he{text-align:center;color:var(--mut);font-size:17px}
.pos{font-size:15px;color:var(--mut);font-weight:400}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px;direction:ltr;text-align:left}
input{width:100%;font:inherit;font-size:22px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;direction:ltr;text-align:left;background:#fff}
input:focus{outline:none;border-color:var(--pri)}
input.good{border-color:var(--ok);background:#ecf9f1}
input.wrong{border-color:var(--bad);background:#fdeeee}
.fb{margin-top:12px;padding:12px;border-radius:10px;text-align:center;font-size:18px}
.fb.good{background:#ecf9f1;color:#126b3a}
.fb.wrong{background:#fdeeee;color:#9b2626}
.fb .ans{direction:ltr;font-weight:700;font-size:21px;margin-top:4px}
.mask{direction:ltr;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:24px;letter-spacing:3px;margin:10px 0}
.opt{display:block;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;font:inherit;font-size:18px;cursor:pointer;color:inherit}
.opt.good{border-color:var(--ok);background:#ecf9f1}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.say{background:var(--soft);border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;vertical-align:middle;margin-inline-start:8px}
table{width:100%;border-collapse:collapse;direction:ltr}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--mut);font-weight:500}
td.h{direction:rtl;text-align:right;color:var(--mut);font-size:15px}
tr.tap{cursor:pointer}
.tip{background:#fff8e1;border:1px solid #f1df9e;border-radius:10px;padding:10px 12px;font-size:15px}
.wl{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}
.wl .e{direction:ltr;font-weight:500}
.wl .t{color:var(--mut);text-align:left}
.flip{min-height:70px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink);text-align:center}
.score{font-size:44px;font-weight:700;text-align:center;margin:10px 0}
</style>
</head>

["{Does Maya live} near the school?","Maya / live","עובדה ← Present Simple. Maya = she ← Does + פועל בלי s"],
["He {doesn't take} the bus. He walks.","not take","הרגל ← Present Simple. he ← doesn't + פועל בלי s (לא isn't!)"],
["We usually {have} dinner at 7:00.","have","usually ← Present Simple"],
["I {know} the answer!","know","know לא מקבל ing ← Present Simple"],

["My mom never {drinks} coffee.","drink","never ← Present Simple. mom = she ← s"],

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return (s||"").toLowerCase().replace(/[’`´]/g,"'").replace(/é/g,"e").replace(/[!?.]/g,"").replace(/\s*[\/,]\s*/g,"/").replace(/\s+/g," ").trim();}
function vAccept(f){const out=new Set([norm(f)]);const inner=f.match(/\(([^)]*)\)/);if(inner)out.add(norm(inner[1]));const base=f.replace(/\([^)]*\)/g,"");out.add(norm(base));norm(base).split("/").forEach(p=>p&&out.add(p));if(norm(base).includes("/")){const p=norm(base).split("/");out.add(p.slice().reverse().join("/"));}return out;}
function wTarget(w){return w.en.replace(/\s*\([^)]*\)/g,"").split(" / ")[0].trim();}
function wAccept(w){const out=new Set([norm(w.en),norm(w.en.replace(/[()]/g,"")),norm(wTarget(w))]);w.alts.forEach(a=>out.add(norm(a)));return out;}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}

// ---------- SESSION ENGINE ----------
let S=null;
function start(title,items,keepOrder){
 if(!items.length)return;
 S={title,items,keepOrder,queue:keepOrder?items.slice():shuffle(items.slice()),total:items.length,done:0,wrong:new Set(),back:screen,answered:false,t0:Date.now(),tries:0};
 next();
}
function resolve(ok){
 const it=S.queue.shift(),k=key(it);S.tries++;
 if(ok){S.done++;if(!S.wrong.has(k))delete store.mist[k];}
 else{S.wrong.add(k);store.mist[k]=1;S.queue.splice(Math.min(3,S.queue.length),0,it);}
 S.answered=true;save();
}
function header(){
 const pct=Math.round(S.done/S.total*100);
 return `${topBar(S.title)}<div class="bar"><i style="width:${pct}%"></i></div><div class="cnt">${S.done} / ${S.total}</div>`;
}
function next(){
 if(!S.queue.length)return finish();
 S.answered=false;
 const it=S.queue[0];
 ({verb:rVerb,spell:rSpell,mc:rMC,card:rCard,vsent:rVSent,vform:rVForm,wsent:rWSent,gram:rGram})[it.mode](it);
 $("#back").onclick=()=>{const b=S.back;logSession(false);S=null;(b||home)();};
}
function label(it){if(it.kind==="gram")return it.s.replace(/\{([^}]*)\}/,"[$1]");return it.kind==="verb"?`${it.inf} – ${it.ps} – ${it.pp}`:`${it.en} = ${it.he}`;}
function logSession(finished){
 if(!S||!S.tries)return;
 const wrong=S.items.filter(i=>S.wrong.has(key(i))).map(label);
 const answered=finished?S.total:S.done+S.wrong.size;
 addLog({at:new Date().toISOString(),title:S.title,total:S.total,answered,firstTry:S.items.filter(i=>!S.wrong.has(key(i))&&!S.queue.includes(i)).length,finished,mins:Math.max(1,Math.round((Date.now()-S.t0)/60000)),wrong});
}
function finish(){
 const first=S.total-S.wrong.size;
 logSession(true);
 const again=S.items, wrongItems=S.items.filter(i=>S.wrong.has(key(i))), title=S.title, back=S.back, keep=S.keepOrder;
 app.innerHTML=`${topBar(title)}
 <h1 style="text-align:center">סיימת! 🎉</h1>
 <div class="score">${first} / ${S.total}</div>
 <p class="sub" style="text-align:center">נכון כבר בפעם הראשונה</p>
 ${wrongItems.length?`<button class="btn warn" id="w" style="text-align:center">🔁 שוב רק את ה‑${wrongItems.length} שטעיתי בהם</button>`:`<div class="tip" style="text-align:center">מושלם! הכל נכון בפעם הראשונה 🌟</div>`}
 <button class="btn alt" id="a" style="text-align:center">שוב את כל הסבב</button>
 <button class="btn" id="sm" style="text-align:center">📊 סיכום התרגול ושליחה</button>
 <button class="btn pri" id="h">לתפריט הראשי</button>`;
 S=null;
 $("#back").onclick=()=>(back||home)();
 if(wrongItems.length)$("#w").onclick=()=>{screen=back;start(title+" · טעויות",wrongItems);};
 $("#a").onclick=()=>{screen=back;start(title,again,keep);};
 $("#h").onclick=home;
 $("#sm").onclick=summary;
}
function nextBtn(){return `<button class="btn pri" id="nx">הבא ←</button>`;}

// verb
function rVerb(it){
 app.innerHTML=`${header()}
 <div class="card">
  <div class="big">${it.inf}<button class="say" id="sp">🔊</button></div>
  <div class="he">${it.he}</div>
  <label>Past Simple</label><input id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <label>Past Participle</label><input id="b" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="fb"></div>
  <button class="btn pri" id="chk">בדיקה</button>
 </div>`;
 const a=$("#a"),b=$("#b");a.focus();
 $("#sp").onclick=()=>say(it.inf);
 a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();b.focus();}};
 b.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};
 $("#chk").onclick=check;
 function check(){
  if(S.answered)return;
  const okA=vAccept(it.ps).has(norm(a.value)),okB=vAccept(it.pp).has(norm(b.value));
  a.className=okA?"good":"wrong";b.className=okB?"good":"wrong";a.readOnly=b.readOnly=true;
  const ok=okA&&okB;resolve(ok);
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"wrong"}">${ok?"✓ מעולה!":"✗ ככה זה:"}<div class="ans">${it.inf} – ${it.ps} – ${it.pp}</div></div>`;
  say(`${it.inf}, ${it.ps.replace(/\(.*\)/,"")}, ${it.pp.replace(/\(.*\)/,"")}`);
  $("#chk").outerHTML=nextBtn();$("#nx").onclick=next;$("#nx").focus();
 }
}
// spell
function rSpell(it){
 const t=wTarget(it);let shown=Math.max(1,Math.min(2,Math.floor(t.replace(/\W/g,"").length/3)));
 const mask=()=>{let c=0;return t.split("").map(ch=>{if(/[a-zA-Zé']/.test(ch)){c++;return c<=shown?ch:"_";}return ch===" "?"  ":ch;}).join("");};
 app.innerHTML=`${header()}
 <div class="card">
  <div class="he" style="font-size:24px;color:var(--ink);font-weight:500">${it.he}</div>
  <div class="he">${it.pos?"("+it.pos+")":""}</div>
  <div class="mask" id="mk">${mask()}</div>
  <input id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="fb"></div>
  <div class="row" id="ctl"><button class="btn" id="hint">💡 עוד אות</button><button class="btn pri" id="chk">בדיקה</button></div>
 </div>`;
 const a=$("#a");a.focus();
 $("#hint").onclick=()=>{shown++;$("#mk").textContent=mask();a.focus();};
 a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};
 $("#chk").onclick=check;
 function check(){
  if(S.answered)return;
  const ok=wAccept(it).has(norm(a.value));
  a.className=ok?"good":"wrong";a.readOnly=true;resolve(ok);
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"wrong"}">${ok?"✓ נכון!":"✗ התשובה:"}<div class="ans">${it.en}</div></div>`;
  say(t);
  $("#ctl").outerHTML=nextBtn();$("#nx").onclick=next;$("#nx").focus();
 }
}
// multiple choice
function rMC(it){
 const pool=ALLW.filter(w=>w.he!==it.he&&w.en!==it.en);
 const same=shuffle(pool.filter(w=>w.set===it.set&&w.pos===it.pos));
 const rest=shuffle(pool.filter(w=>!same.includes(w)));
 const opts=shuffle([it,...same.concat(rest).slice(0,3)]);
 app.innerHTML=`${header()}
 <div class="card">${typeof secTag==="function"?secTag(it):""}
  <div class="big">${it.en}<button class="say" id="sp">🔊</button></div>
  <div class="he">${it.pos?"("+it.pos+")":""}</div>
  ${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.he}</button>`).join("")}
  <div id="fb"></div>
 </div>`;
 $("#sp").onclick=()=>say(wTarget(it));
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  if(S.answered)return;
  const o=opts[+b.dataset.i],ok=o===it;
  app.querySelectorAll(".opt").forEach(x=>{if(opts[+x.dataset.i]===it)x.classList.add("good");});
  if(!ok)b.classList.add("wrong");
  resolve(ok);say(wTarget(it));
  if(ok)setTimeout(()=>{if(S)next();},800);
  else{$("#fb").innerHTML=nextBtn();$("#nx").onclick=next;}
 });
}
// flashcard
function rCard(it){
 app.innerHTML=`${header()}
 <div class="card">
  <div class="big">${it.en}<button class="say" id="sp">🔊</button></div>
  <div class="he">${it.pos?"("+it.pos+")":""}</div>

  $("#fl").textContent=it.he;
  $("#ctl").innerHTML=`<div class="row"><button class="btn" id="no" style="border-color:var(--bad)">✗ עוד לא</button><button class="btn" id="yes" style="border-color:var(--ok)">✓ ידעתי</button></div>`;
  $("#yes").onclick=()=>{resolve(true);next();};
  $("#no").onclick=()=>{resolve(false);next();};
 };

// ---------- SENTENCE MODES ----------
const ansOf=s=>s.match(/\{([^}]*)\}/)[1];
const fill=(s,html)=>s.replace(/\{[^}]*\}/,html);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function maskStr(t,shown){let c=0;return t.split("").map(ch=>{if(/[a-zA-Zé]/.test(ch)){c++;return c<=shown?ch:"_";}return ch===" "?"  ":ch;}).join("");}
const secTag=it=>it.sec?`<div class="tip" style="margin-bottom:8px;font-weight:500">${it.sec}</div>`:"";
const sentBox=html=>`<div style="direction:ltr;text-align:left;font-size:20px;line-height:1.7;margin:6px 0 4px">${html}</div>`;
function vSentItem(v,which,sec){which=which||(Math.random()<.5?"ps":"pp");return {...v,mode:"vsent",which,sec};}
function vFormOpts(v,which){const ans=ansOf(VSENT[v.inf][which==="ps"?0:1]);const o=[v.inf];[v.ps,v.pp].forEach(f=>f.replace(/\([^)]*\)/g,"").split("/").forEach(p=>{p=p.trim();if(p&&!o.includes(p))o.push(p);}));if(!o.includes(ans))o.push(ans);return o;}
function rule(it,s){
 if(it.which==="pp"){const m=s.match(/\b(have|has|had|haven't|hasn't)\b/i);return `יש <b dir="ltr">${m?m[1]:"have"}</b> לפני הפועל ← צורה 3 (Past Participle)`;}
 return it.inf==="be"?"עבר רגיל, ו‑we/you/they ← were (צורה 2)":"פעולה שקרתה בעבר, בלי have ← צורה 2 (Past Simple)";
}
function rVSent(it){
 const s=VSENT[it.inf][it.which==="ps"?0:1],ans=ansOf(s);
 app.innerHTML=`${header()}
 <div class="card">${secTag(it)}
  <div class="cnt">השלימו את הפועל בצורה הנכונה</div>
  ${sentBox(fill(esc(s),`<b>_______</b> <span style="color:var(--pri)">(${it.inf})</span>`))}
  <input id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${it.inf} → ?">
  <div id="fb"></div>
  <button class="btn pri" id="chk">בדיקה</button>
 </div>`;
 const a=$("#a");a.focus();
 a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};
 $("#chk").onclick=check;
 function check(){
  if(S.answered)return;
  const acc=vAccept(ans);if(it.which==="pp")vAccept(it.pp).forEach(x=>acc.add(x));else if(it.inf!=="be")vAccept(it.ps).forEach(x=>acc.add(x));
  const ok=acc.has(norm(a.value));a.className=ok?"good":"wrong";a.readOnly=true;resolve(ok);
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"wrong"}">${ok?"✓ נכון!":"✗ התשובה הנכונה:"}${sentBox(fill(esc(s),`<u><b>${ans}</b></u>`))}<div style="font-size:15px">${rule(it,s)}</div></div>`;
  say(s.replace(/[{}]/g,""));
  $("#chk").outerHTML=nextBtn();$("#nx").onclick=next;$("#nx").focus();
 }
}
function rVForm(it){
 const s=VSENT[it.inf][it.which==="ps"?0:1],ans=ansOf(s),opts=shuffle(vFormOpts(it,it.which));
 app.innerHTML=`${header()}
 <div class="card">${secTag(it)}
  <div class="cnt">בחרו את הצורה הנכונה</div>
  ${sentBox(fill(esc(s),`<b>_______</b>`))}
  ${opts.map((o,i)=>`<button class="opt" data-i="${i}" style="direction:ltr;text-align:center">${o}</button>`).join("")}
  <div id="fb"></div>
 </div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  if(S.answered)return;
  const ok=opts[+b.dataset.i]===ans;
  app.querySelectorAll(".opt").forEach(x=>{if(opts[+x.dataset.i]===ans)x.classList.add("good");});
  if(!ok)b.classList.add("wrong");
  resolve(ok);
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"wrong"}" style="font-size:15px">${rule(it,s)}</div>${nextBtn()}`;$("#nx").onclick=next;
 });
}
function rWSent(it){
 const s=WSENT[it.en],ans=ansOf(s);let shown=Math.max(1,Math.min(3,Math.floor(ans.replace(/\W/g,"").length/3)));
 const blank=()=>`<span id="mk" style="font-family:ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--pri);font-weight:700">${maskStr(ans,shown)}</span>`;
 app.innerHTML=`${header()}
 <div class="card">${secTag(it)}
  <div class="cnt">השלימו את המילה החסרה</div>
  ${sentBox(fill(esc(s),blank()))}
  <div class="he" id="hh" style="min-height:24px"></div>
  <input id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="fb"></div>
  <div class="row" id="ctl"><button class="btn" id="h1">🇮🇱 רמז</button><button class="btn" id="h2">🔤 אות</button><button class="btn pri" id="chk">בדיקה</button></div>
 </div>`;
 const a=$("#a");a.focus();
 $("#h1").onclick=()=>{$("#hh").textContent=it.he;a.focus();};
 $("#h2").onclick=()=>{shown++;$("#mk").textContent=maskStr(ans,shown);a.focus();};
 a.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check();}};
 $("#chk").onclick=check;
 function check(){
  if(S.answered)return;
  const u=norm(a.value),na=norm(ans);
  let ok=u===na||u.replace(/'/g,"")===na.replace(/'/g,"");
  if(!ok&&na===norm(wTarget(it)))ok=wAccept(it).has(u);
  a.className=ok?"good":"wrong";a.readOnly=true;resolve(ok);
  $("#fb").innerHTML=`<div class="fb ${ok?"good":"wrong"}">${ok?"✓ נכון!":"✗ התשובה הנכונה:"}${sentBox(fill(esc(s),`<u><b>${ans}</b></u>`))}<div style="font-size:15px">${it.en} = ${it.he}</div></div>`;
  say(s.replace(/[{}]/g,""));
  $("#ctl").outerHTML=nextBtn();$("#nx").onclick=next;$("#nx").focus();
 }
}

// ---------- GRAMMAR SCREENS ----------
function expand(s){
 return norm(s).replace(/won't/g,"will not").replace(/can't|cannot/g,"can not").replace(/n't/g," not")
  .replace(/\bi'm\b/g,"i am").replace(/'re\b/g," are").replace(/\b(he|she|it|what|who|that|there)'s\b/g,"$1 is").replace(/\s+/g," ").trim();
}

 screen=gramRules;
 const ex=(a,b)=>`<div style="direction:ltr;text-align:left;margin:4px 0">${a}</div><div class="cnt" style="margin-bottom:6px">${b}</div>`;
 app.innerHTML=`${topBar()}
 <h1>Simple או Progressive?</h1>
 <div class="card"><b>שאלה 1: מתי זה קורה?</b>

// ---------- SUMMARY ----------
const dayKey=d=>new Date(d).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
const hm=d=>new Date(d).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
async function summary(){
 screen=summary;
 app.innerHTML=`${topBar()}<h1>📊 סיכום התרגול</h1><p class="sub">טוען…</p>`;
 $("#back").onclick=home;
 const log=(await getLog()).filter(e=>e&&e.at);
 if(screen!==summary)return;
 const today=dayKey(Date.now());
 let view="today";
 function render(){
  const list=view==="today"?log.filter(e=>dayKey(e.at)===today):log;
  const mins=list.reduce((a,e)=>a+(e.mins||0),0);
  const wrongAll=[...new Set(list.flatMap(e=>e.wrong||[]))];
  const m=mistCount();
  const lines=list.slice().reverse().map(e=>`• ${hm(e.at)} ${e.title}: ${e.firstTry}/${e.total} נכון בפעם הראשונה${e.finished?"":` (הפסיק באמצע, ענה על ${e.answered})`}, ${e.mins} דק'`);
  const text=`סיכום תרגול אנגלית של שחר${view==="today"?" – היום, "+today:""}\n`+
   `${list.length} סבבים, בערך ${mins} דקות\n\n`+lines.join("\n")+
   (wrongAll.length?`\n\nטעה ב:\n`+wrongAll.slice(0,40).join("\n")+(wrongAll.length>40?`\nועוד ${wrongAll.length-40}`:""):"")+
   `\n\nברשימת "מה שטעיתי בו" נשארו ${m} פריטים לחיזוק.`;
  app.innerHTML=`${topBar()}<h1>📊 סיכום התרגול</h1>
  <div class="row"><button class="btn ${view==="today"?"pri":""}" id="vt">היום</button><button class="btn ${view==="all"?"pri":""}" id="va">הכל</button></div>
  ${!list.length?`<div class="card">${view==="today"?"עוד לא תרגלת היום.":"עוד אין תרגולים שמורים."}</div>`:`
  <div class="card"><b>${list.length} סבבים · בערך ${mins} דקות</b>
   ${list.map(e=>`<div class="wl"><span>${view==="all"?dayKey(e.at)+" ":""}${hm(e.at)} · ${e.title}${e.finished?"":" <span class='pos'>(באמצע)</span>"}</span><span class="t" style="white-space:nowrap">${e.firstTry}/${e.total}</span></div>`).join("")}
  </div>
  ${wrongAll.length?`<div class="card"><b>טעויות (${wrongAll.length})</b>${wrongAll.map(w=>`<div class="wl"><span class="e">${esc(w)}</span></div>`).join("")}</div>`:""}`}
  <div class="tip">ברשימת "מה שטעיתי בו" נשארו <b>${m}</b> פריטים לחיזוק.</div>
  <a class="btn pri" id="wa" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener" style="text-decoration:none;box-sizing:border-box">📲 שליחת הסיכום בוואטסאפ</a>
  <button class="btn" id="cp" style="text-align:center">📋 העתקת הסיכום</button>`;
  $("#back").onclick=home;
  $("#vt").onclick=()=>{view="today";render();};
  $("#va").onclick=()=>{view="all";render();};
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(text);$("#cp").textContent="✓ הועתק";}catch(e){$("#cp").textContent="ההעתקה לא עבדה, אפשר לשלוח בוואטסאפ";}};
 }
 render();
}

// ---------- FINAL TEST ----------
function finalTest(){
 const A="חלק א · בחירת צורת הפועל",B="חלק ב · כתיבת הפועל במשפט",G="חלק ג · Simple או Progressive",C="חלק ד · השלמת מילים במשפטים",D="חלק ה · מה הפירוש?";
 const vs=shuffle(VERBS.slice());
 const formPool=vs.filter(v=>vFormOpts(v,"pp").length>=3);
 const partA=formPool.slice(0,5).map(v=>({...v,mode:"vform",which:Math.random()<.5?"ps":"pp",sec:A}));
 const usedA=new Set(partA.map(x=>x.inf));
 const partB=vs.filter(v=>!usedA.has(v.inf)).slice(0,10).map((v,i)=>vSentItem(v,i%2?"pp":"ps",B));
 const ws=shuffle(ALLW.filter(w=>WSENT[w.en]));
 const partC=ws.slice(0,15).map(w=>({...w,mode:"wsent",sec:C}));
 const partD=ws.slice(15,20).map(w=>({...w,mode:"mc",sec:D}));
 const partG=shuffle(GRAM.slice()).slice(0,10).map(g=>({...g,mode:"gram",sec:G}));
 start("מבחן מסכם",partA.concat(shuffle(partB),partG,partC,partD),true);
}

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&S&&S.answered&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();next();}});
home();
</script>
