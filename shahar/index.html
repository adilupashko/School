<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>התרגולים של שחר</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Rubik',system-ui,sans-serif;background:#fbf5ea;color:#1d2a33}
  header{background:linear-gradient(135deg,#b45309,#ea8c2c);color:#fff;padding:28px 20px}
  .wrap{max-width:760px;margin:0 auto}
  h1{margin:0;font-size:30px}
  header p{margin:6px 0 0;opacity:.9}
  main{padding:24px 20px 60px}
  h2{font-size:15px;letter-spacing:.05em;color:#b45309;margin:24px 0 10px}
  a.card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e6dccb;border-radius:16px;padding:16px 18px;margin-bottom:10px;text-decoration:none;color:inherit;transition:transform .15s, box-shadow .15s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .ico{font-size:30px}
  .t{font-weight:800}
  .d{color:#5e6d77;font-size:15px}
  .empty{background:#fff;border:2px dashed #e6dccb;border-radius:16px;padding:28px;text-align:center;color:#5e6d77}
  .back{display:inline-block;margin-top:24px;color:#b45309;font-weight:600;text-decoration:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:8px}
  .kid{flex-direction:column;justify-content:center;text-align:center;padding:26px 14px;border-top:6px solid var(--k)}
  .kid .ico{font-size:44px}
  .kid .t{font-size:22px}
</style>
</head>
<body>
<header><div class="wrap"><h1>🌅 התרגולים של שחר</h1><p>בוחרים תרגול ומתחילים</p></div></header>
<main class="wrap">
  <h2>אנגלית</h2>
  <a class="card" href="english-test/"><span class="ico">💪</span><span><div class="t">מתכוננים למבחן באנגלית</div><div class="d">50 פעלים חריגים · Present Simple / Progressive · אוצר מילים · מבחן מסכם</div></span></a>
  <a class="back" href="../">→ לכל הילדים</a>
</main>
</body>
</html>
